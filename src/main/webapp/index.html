<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Java Delivery | Iniciar sesión</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" />
    <link
      href="https://fonts.googleapis.com/css2?family=Lexend:wght@400;500;600;700;800&display=swap"
      rel="stylesheet"
    />
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
    />
    <link rel="stylesheet" href="styles/main.css" />
    <link rel="icon" type="ico" href="assets/icon2.ico" />
  </head>
  <body class="page">
    <!-- <header class="page__header" aria-hidden="true"></header> -->

    <main class="signin-layout">
      <section class="signin-panel" aria-label="Sección de inicio de sesión">
        <div class="signin-brand" aria-label="Espacio para logo del sitio">
          <div class="signin-brand__placeholder" aria-hidden="true">
            <img src="assets/logo2.png" alt="Logo del sitio">
          </div>
        </div>

        <div class="signin-content">
          <h1 class="signin-title">Inicia sesión con tu cuenta</h1>

          <form class="signin-form" action="signin" method="post">
            <div class="signin-form__field">
              <label class="visually-hidden" for="email">Email</label>
              <input
                id="email"
                class="signin-form__input"
                type="email"
                name="email"
                placeholder="Ingrese su email..."
                autocomplete="email"
                required
              />
            </div>

            <div class="signin-form__field">
              <label class="visually-hidden" for="password">Contraseña</label>
              <input
                id="password"
                class="signin-form__input"
                type="password"
                name="password"
                placeholder="Ingrese su contraseña..."
                autocomplete="current-password"
                required
              />
            </div>



            <button class="signin-form__button" type="submit">Iniciar sesión</button>
          </form>
          
          <form action="signup" method="get">
            <p class="signin-form__register">
              ¿No tienes una cuenta?
              <a href="signup" class="signin-form__link"><button class="signin-form__link" type="submit">Regístrate</button></a>
            </p>
		  </form>
			<form action='signin' method='post'>
            	<p class="signin-form__register">
            	  ¿Quieres ingresar como invitado?
            	  <a href="guest" class="signin-form__link"><button class="signin-form__link" type="submit" name='role' value='guest'>Entrar como invitado</button></a>
            	</p>
            </form>
        </div>
      </section>
    </main>

    <!-- <footer class="page__footer" aria-hidden="true"></footer> -->
  </body>
</html>
